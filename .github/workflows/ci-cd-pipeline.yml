name: CI/CD Pipeline — OrderService

on:
push:
branches: [main, develop]
pull_request:
branches: [main]

env:
REGISTRY: ghcr.io
IMAGE_NAME: ${{ github.repository }}/orderservice

jobs:


  # ---------- STAGE 1: Checkout & Static Analysis ----------
  lint:
    name: Checkout & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install flake8 black

      - name: Run flake8
        run: flake8 app/ --max-line-length=100 --extend-ignore=E501

      - name: Check formatting (black)
        run: black --check app/

  # ---------- STAGE 2: Automated Testing ----------
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pytest pytest-cov

      - name: Run test suite with coverage gate
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ---------- STAGE 3: Container Build & Vulnerability Scan ----------
  build:
    name: Build & Scan Container Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        
      - name: Set image tag
        id: meta
        shell: bash
        run: |
          IMAGE_NAME_LOWER=$(echo "${GITHUB_REPOSITORY}/orderservice" | tr '[:upper:]' '[:lower:]')
          echo "tag=ghcr.io/${IMAGE_NAME_LOWER}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

              
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tag }}
          load: true

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tag }}
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Push image to registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tag }}

  # ---------- STAGE 4: Deploy to Staging ----------
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy to staging cluster
        run: |
          echo "kubectl set image deployment/orderservice orderservice=${{ needs.build.outputs.image_tag }} -n staging"
          # kubectl apply -f k8s/staging/ --record

      - name: Wait for rollout
        run: echo "kubectl rollout status deployment/orderservice -n staging --timeout=120s"

      - name: Run smoke tests against staging
        run: |
          # curl -f https://staging.orderservice.internal/health
          echo "Smoke test: GET /health -> expect 200"

  # ---------- STAGE 5: Canary Release to Production ----------
  deploy-production:
    name: Canary Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production   # requires manual approval gate in GitHub environment settings
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Shift 10% traffic to canary
        run: echo "kubectl apply -f k8s/production/canary-10.yaml"

      - name: Monitor canary health/error-rate for 5 minutes
        run: |
          echo "Querying Prometheus for error_rate{version=canary} < 1% and p95_latency < 300ms"
          # Fail the job automatically if SLO thresholds are breached

      - name: Promote to 100% or roll back
        run: |
          echo "If canary healthy: kubectl apply -f k8s/production/promote-100.yaml"
          echo "If canary unhealthy: kubectl rollout undo deployment/orderservice -n production"
