# Canary release: stable handles 90% of traffic, canary handles 10%.
# The pipeline promotes canary -> stable only if SLO checks pass (see workflow).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderservice-stable
  namespace: production
  labels:
    app: orderservice
    track: stable
spec:
  replicas: 9
  selector:
    matchLabels:
      app: orderservice
      track: stable
  template:
    metadata:
      labels:
        app: orderservice
        track: stable
    spec:
      containers:
        - name: orderservice
          image: ghcr.io/org/orderservice:PREVIOUS_STABLE_SHA
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderservice-canary
  namespace: production
  labels:
    app: orderservice
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderservice
      track: canary
  template:
    metadata:
      labels:
        app: orderservice
        track: canary
    spec:
      containers:
        - name: orderservice
          image: ghcr.io/org/orderservice:NEW_SHA
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
---
# Service selects on 'app' only, so it load-balances across BOTH stable (9 pods)
# and canary (1 pod) -> ~90/10 traffic split.
apiVersion: v1
kind: Service
metadata:
  name: orderservice
  namespace: production
spec:
  selector:
    app: orderservice
  ports:
    - port: 80
      targetPort: 8080
