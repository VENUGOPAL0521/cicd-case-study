apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderservice
  namespace: staging
  labels:
    app: orderservice
    env: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orderservice
  template:
    metadata:
      labels:
        app: orderservice
    spec:
      containers:
        - name: orderservice
          image: ghcr.io/org/orderservice:latest   # replaced by pipeline with commit-SHA tag
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: orderservice
  namespace: staging
spec:
  selector:
    app: orderservice
  ports:
    - port: 80
      targetPort: 8080
